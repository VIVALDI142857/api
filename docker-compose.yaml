services:
  fastapi:
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/mlflow-access.json
    container_name: fastapi
    build: ./api_practice
    ports:
      - "8000:8000"
    volumes:
      - /home/vivaldi/.gcp:/credentials

  grpc:
    container_name: grpc
    build: ./grpc
    ports:
      - "50051:50051"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/mlflow-access.json
    volumes:
      - /home/vivaldi/.gcp:/credentials
  streamlit:
    container_name: streamlit
    build: ./streamlit
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
  gradio:
    container_name: gradio
    build: ./gradio
    ports: 
     - "7860:7860"
    depends_on:
      - fastapi


